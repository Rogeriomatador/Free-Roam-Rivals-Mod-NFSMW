; Free Roam Rivals vehicle pool design.
; Runtime parsing is planned; the domain selector already implements the same
; progression-aware rules. Vehicle keys are MW05 pvehicle collection names.
;
; Format:
; key:weight
;
; Special/Legendary vehicles are intentionally excluded from normal tiers.

[Tier1]
Cars=cobaltss:110,punto:105,gti:110,is300:95,a3:90,clio:80

[Tier2]
Cars=rx8:110,eclipsegt:110,tt:90,a4:85,mustanggt:105,gto:100,monaro:85,clk500:75,cts:75

[Tier3]
Cars=supra:110,rx7:110,imprezawrx:100,lancerevo8:100,elise:85,caymans:90,sl500:75

[Tier4]
Cars=997s:95,corvette:100,db9:80,gallardo:90,viper:90,sl65:75

[Tier5]
Cars=fordgt:75,murcielago:70,slr:65,911Turbo:65,carreragt:55

[Legendary]
; Requires explicit legendary eligibility. Never ordinary procedural population.
Cars=911gt2:25,camaro:20,bmwm3:18,bmwm3gtr:8,bmwm3gtre46:5,corvettec6r:5

[Population]
UseVanillaCatalog=1
AllowProceduralLocals=1
PromoteLocalToPersistentOnAcceptedChallenge=1
AllowLegendaryInNormalProceduralPool=0
AllowSpecialInNormalProceduralPool=0
SoftAvoidImmediateModelRepeat=1

[Customization]
GenerateVisualStyleOnce=1
PersistGeneratedCustomization=1
AllowRandomPaint=1
AllowRandomVisualParts=1
AllowRandomPerformance=0
