name: Build Win32 ASI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32
        run: cmake -S . -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run domain/system tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Audit motion capture tests
        run: python -m unittest discover -s tests -p test_motion_capture.py

      - name: Collect ASI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.asi | ForEach-Object {
            Copy-Item $_.FullName artifact/
          }
          Get-ChildItem artifact

      - name: Upload ASI artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeRoamRivals-Win32
          path: artifact/*.asi
          if-no-files-found: error

      - name: Create install package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $pkg = "release/package"
          New-Item -ItemType Directory -Force "$pkg/scripts/FreeRoamRivals" | Out-Null

          Copy-Item "artifact/FreeRoamRivals.asi" "$pkg/scripts/FreeRoamRivals.asi"
          Copy-Item "config/FreeRoamRivals.ini" "$pkg/scripts/FreeRoamRivals/FreeRoamRivals.ini"
          Copy-Item "config/Rivals.ini" "$pkg/scripts/FreeRoamRivals/Rivals.ini"
          Copy-Item "config/VehiclePools.ini" "$pkg/scripts/FreeRoamRivals/VehiclePools.ini"
          Copy-Item "config/UndergroundBlacklist.ini" "$pkg/scripts/FreeRoamRivals/UndergroundBlacklist.ini"
          New-Item -ItemType Directory -Force "$pkg/tools" | Out-Null
          Copy-Item "tools/analyze_motion_capture.py" "$pkg/tools/"
          Copy-Item "docs/MOTION_CAPTURE.md" "$pkg/MOTION_CAPTURE.md"
          Copy-Item "docs/RENDER_HOOK_RECOVERY.md" "$pkg/RENDER_HOOK_RECOVERY.md"
          Copy-Item "docs/GAMEPLAY_LOOP_RECOVERY.md" "$pkg/GAMEPLAY_LOOP_RECOVERY.md"
          Copy-Item "docs/TARGET_CAPTURE_2026-10-07.md" "$pkg/TARGET_CAPTURE_2026-10-07.md"
          Copy-Item "docs/TARGET_CAPTURE_V26_2026-10-07.md" "$pkg/TARGET_CAPTURE_V26_2026-10-07.md"
          Copy-Item "docs/TARGET_CAPTURE_V27_ALL_DIAGNOSTICS_2026-10-07.md" "$pkg/TARGET_CAPTURE_V27_ALL_DIAGNOSTICS_2026-10-07.md"
          Copy-Item "docs/TARGET_CAPTURE_V28_ALL_DIAGNOSTICS_2026-10-07.md" "$pkg/TARGET_CAPTURE_V28_ALL_DIAGNOSTICS_2026-10-07.md"
          Copy-Item "docs/COORDINATE_CONVENTIONS.md" "$pkg/COORDINATE_CONVENTIONS.md"

          @"
          NFSMW Free Roam Rivals v0.0.29-dev

          INSTALL:
          1. Extract this ZIP into the Need for Speed Most Wanted game folder.
          2. Confirm FreeRoamRivals.asi is inside the scripts folder.
          3. When updating, replace only the ASI and keep your edited INI.
          4. Keep your existing INI when updating.
          5. For the v0.0.29 validation, leave FrameTick, world collision and
             motion capture enabled. Camera/Input may stay enabled too.
          6. Enter Free Roam and drive normally for about 90-120 seconds.
          7. Prefer the Golf GTI for this run if it is available in the garage;
             this also lets the exact selected rival model footprint be observed.
          8. Send scripts\FreeRoamRivals\FreeRoamRivals.log.

          v0.0.29 canonicalizes NFSPluginSDK vector reads to MW X/Y-up/Z,
          preserves the verified live-IVehicle occupancy fix, repairs vertical
          ground semantics and can promote a source-backed metric scale.
          Construction and all mutation systems remain disabled.

          Runtime vehicle creation and AI control are still disabled by default.
          ExperimentalSpawnEnabled=1 only enables read-only preflight diagnostics
          in this build; it does not spawn a car.

          Supported development target:
          speed.exe size: 6029312 bytes
          MD5: C0516B485065FABDD69579816B5DF763
          "@ | Set-Content "$pkg/INSTALL.txt" -Encoding UTF8

          New-Item -ItemType Directory -Force "release" | Out-Null
          Compress-Archive -Path "$pkg/*" -DestinationPath "release/FreeRoamRivals-v0.0.29-dev.zip" -Force

      - name: Publish v0.0.29-dev GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.0.29-dev"

          $published = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $existing = gh release view $tag --json targetCommitish,assets 2>$null
            if ($LASTEXITCODE -eq 0) {
              $info = $existing | ConvertFrom-Json
              if ($info.targetCommitish -ne "${{ github.sha }}") {
                throw "Existing release target does not match this source commit."
              }
              if ($info.assets.name -contains "FreeRoamRivals-v0.0.29-dev.zip") {
                $published = $true
                break
              }
              gh release upload $tag "release/FreeRoamRivals-v0.0.29-dev.zip"
            } else {
              gh release create $tag "release/FreeRoamRivals-v0.0.29-dev.zip" `
                --target "${{ github.sha }}" `
                --title "Free Roam Rivals v0.0.29-dev" `
                --prerelease `
                --notes "v0.0.29-dev: canonicaliza vetores NFSPluginSDK para X/Y-up/Z, corrige semântica vertical de colisão/OBB e adiciona calibração métrica fail-closed com velocidade m/s respaldada por fonte. Criação de rivais continua desativada."
            }
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          if (-not $published) { throw "Release publication failed after three attempts." }
