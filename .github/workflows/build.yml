name: Build Win32 ASI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32
        run: cmake -S . -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run domain/system tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect ASI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.asi | ForEach-Object {
            Copy-Item $_.FullName artifact/
          }
          Get-ChildItem artifact

      - name: Upload ASI artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeRoamRivals-Win32
          path: artifact/*.asi
          if-no-files-found: error

      - name: Create install package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $pkg = "release/package"
          New-Item -ItemType Directory -Force "$pkg/scripts/FreeRoamRivals" | Out-Null

          Copy-Item "artifact/FreeRoamRivals.asi" "$pkg/scripts/FreeRoamRivals.asi"
          Copy-Item "config/FreeRoamRivals.ini" "$pkg/scripts/FreeRoamRivals/FreeRoamRivals.ini"
          Copy-Item "config/Rivals.ini" "$pkg/scripts/FreeRoamRivals/Rivals.ini"
          Copy-Item "config/VehiclePools.ini" "$pkg/scripts/FreeRoamRivals/VehiclePools.ini"
          Copy-Item "config/UndergroundBlacklist.ini" "$pkg/scripts/FreeRoamRivals/UndergroundBlacklist.ini"

          @"
          NFSMW Free Roam Rivals v0.0.11-dev

          INSTALL:
          1. Extract this ZIP into the Need for Speed Most Wanted game folder.
          2. Confirm FreeRoamRivals.asi is inside the scripts folder.
          3. Start the game and enter Free Roam.
          4. Drive for 20-30 seconds.
          5. Check scripts\FreeRoamRivals\FreeRoamRivals.log.

          v0.0.11 keeps the live WRoadNav/persistence foundation and adds an
          opt-in read-only probe at GameFrameTick (0x663D30) to validate the
          exact main-loop callback/thread before spawn or AI mutation.

          Runtime vehicle creation and AI control are still disabled by default.
          ExperimentalSpawnEnabled=1 only enables read-only preflight diagnostics
          in this build; it does not spawn a car.

          Supported development target:
          speed.exe size: 6029312 bytes
          MD5: C0516B485065FABDD69579816B5DF763
          "@ | Set-Content "$pkg/INSTALL.txt" -Encoding UTF8

          New-Item -ItemType Directory -Force "release" | Out-Null
          Compress-Archive -Path "$pkg/*" -DestinationPath "release/FreeRoamRivals-v0.0.11-dev.zip" -Force

      - name: Publish v0.0.11-dev GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.0.11-dev"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping existing release."
          } else {
            gh release create $tag "release/FreeRoamRivals-v0.0.11-dev.zip" `
              --target "${{ github.sha }}" `
              --title "Free Roam Rivals v0.0.11-dev" `
              --prerelease `
              --notes "v0.0.11-dev: adiciona uma Blacklist secundária real e independente para o pós-carreira, com ranks, descoberta, requisitos, caça no Free Roam e chaves futuras de foto/áudio. Também documenta o caminho para uma tela FNG nativa sem sobrescrever a Blacklist original. Spawn/IA e frontend mutation continuam bloqueados até validação."
          }
