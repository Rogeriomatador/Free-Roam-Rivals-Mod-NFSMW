name: Build Win32 ASI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32
        run: cmake -S . -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run domain/system tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Audit motion capture tests
        run: python -m unittest discover -s tests -p test_motion_capture.py

      - name: Collect ASI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.asi | ForEach-Object {
            Copy-Item $_.FullName artifact/
          }
          Get-ChildItem artifact

      - name: Upload ASI artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeRoamRivals-Win32
          path: artifact/*.asi
          if-no-files-found: error

      - name: Create install package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $pkg = "release/package"
          New-Item -ItemType Directory -Force "$pkg/scripts/FreeRoamRivals" | Out-Null

          Copy-Item "artifact/FreeRoamRivals.asi" "$pkg/scripts/FreeRoamRivals.asi"
          Copy-Item "config/FreeRoamRivals.ini" "$pkg/scripts/FreeRoamRivals/FreeRoamRivals.ini"
          Copy-Item "config/Rivals.ini" "$pkg/scripts/FreeRoamRivals/Rivals.ini"
          Copy-Item "config/VehiclePools.ini" "$pkg/scripts/FreeRoamRivals/VehiclePools.ini"
          Copy-Item "config/UndergroundBlacklist.ini" "$pkg/scripts/FreeRoamRivals/UndergroundBlacklist.ini"
          New-Item -ItemType Directory -Force "$pkg/tools" | Out-Null
          Copy-Item "tools/analyze_motion_capture.py" "$pkg/tools/"
          Copy-Item "docs/MOTION_CAPTURE.md" "$pkg/MOTION_CAPTURE.md"
          Copy-Item "docs/RENDER_HOOK_RECOVERY.md" "$pkg/RENDER_HOOK_RECOVERY.md"

          @"
          NFSMW Free Roam Rivals v0.0.25-dev

          INSTALL:
          1. Extract this ZIP into the Need for Speed Most Wanted game folder.
          2. Confirm FreeRoamRivals.asi is inside the scripts folder.
          3. Start the game and enter Free Roam.
          4. For capture, set MotionCaptureEnabled=1 under [Diagnostics] in the INI.
          5. Enter Free Roam and drive steadily for 60-90 seconds.
          6. Check scripts\FreeRoamRivals\FreeRoamRivals.log.
          7. If renderFrames/samples remain zero, send the log; do not repeat driving runs.

          v0.0.25 recovers read-only render observation with guarded EndScene/Present
          method hooks, device tracking and periodic health. When updating from
          v0.0.24, replace the ASI and keep your edited INI. See MOTION_CAPTURE.md.
          Metre scale and target-game callback delivery remain unverified.

          Runtime vehicle creation and AI control are still disabled by default.
          ExperimentalSpawnEnabled=1 only enables read-only preflight diagnostics
          in this build; it does not spawn a car.

          Supported development target:
          speed.exe size: 6029312 bytes
          MD5: C0516B485065FABDD69579816B5DF763
          "@ | Set-Content "$pkg/INSTALL.txt" -Encoding UTF8

          New-Item -ItemType Directory -Force "release" | Out-Null
          Compress-Archive -Path "$pkg/*" -DestinationPath "release/FreeRoamRivals-v0.0.25-dev.zip" -Force

      - name: Publish v0.0.25-dev GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.0.25-dev"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping existing release."
          } else {
            gh release create $tag "release/FreeRoamRivals-v0.0.25-dev.zip" `
              --target "${{ github.sha }}" `
              --title "Free Roam Rivals v0.0.25-dev" `
              --prerelease `
              --notes "v0.0.25-dev: correção da coleta via EndScene/Present, rastreamento do dispositivo e saúde contínua dos hooks. Inclui testes Win32 de ponteiros armazenados e troca de dispositivo. Criação de rivais continua bloqueada."
          }
