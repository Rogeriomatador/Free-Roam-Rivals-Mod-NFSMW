name: Build Win32 ASI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32
        run: cmake -S . -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Run domain/system tests
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Audit motion capture tests
        run: python -m unittest discover -s tests -p test_motion_capture.py

      - name: Exe function dump tool tests
        run: python -m unittest discover -s tests -p test_dump_exe_functions.py

      - name: Diagnostic bundle collector tests
        run: python -m unittest discover -s tests -p test_diagnostic_bundle.py

      - name: Collect ASI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.asi | ForEach-Object {
            Copy-Item $_.FullName artifact/
          }
          Get-ChildItem artifact

      - name: Upload ASI artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeRoamRivals-Win32
          path: artifact/*.asi
          if-no-files-found: error

      - name: Create ready-to-install package
        shell: pwsh
        run: |
          $pkg = "release/package"
          New-Item -ItemType Directory -Force "$pkg/scripts/FreeRoamRivals" | Out-Null

          Copy-Item "artifact/FreeRoamRivals.asi" "$pkg/scripts/FreeRoamRivals.asi"
          # The main ZIP is plug-and-play: the PLAY preset is already the active INI.
          # Ship the conservative default outside scripts for reference only.
          Copy-Item "config/FreeRoamRivals-play.ini" "$pkg/scripts/FreeRoamRivals/FreeRoamRivals.ini"
          Copy-Item "config/FreeRoamRivals.ini" "$pkg/FreeRoamRivals-safe.ini"
          Copy-Item "docs/TARGET_CAPTURE_V42_CHALLENGE_TIME.md" "$pkg/TARGET_CAPTURE_V42_CHALLENGE_TIME.md"
          Copy-Item "docs/LIVE_RIVAL_V42.md" "$pkg/LIVE_RIVAL_V42.md"
          Copy-Item "docs/RIVAL_LOCATOR_AND_RETRY_V44.md" "$pkg/RIVAL_LOCATOR_AND_RETRY_V44.md"
          Copy-Item "docs/RIVAL_REACTIONS_V45.md" "$pkg/RIVAL_REACTIONS_V45.md"
          Copy-Item "docs/PERSISTENT_WORLD_METRIC_V46.md" "$pkg/PERSISTENT_WORLD_METRIC_V46.md"
          Copy-Item "docs/NATIVE_ASSET_INVENTORY_V47.md" "$pkg/NATIVE_ASSET_INVENTORY_V47.md"
          Copy-Item "docs/GUARDED_REENCOUNTER_V48.md" "$pkg/GUARDED_REENCOUNTER_V48.md"
          Copy-Item "docs/ROAD_RESET_EVIDENCE_V49.md" "$pkg/ROAD_RESET_EVIDENCE_V49.md"
          Copy-Item "docs/VISIBLE_PROTOTYPE_V50.md" "$pkg/VISIBLE_PROTOTYPE_V50.md"
          Copy-Item "docs/RICO_AHEAD_SPAWN_V51.md" "$pkg/RICO_AHEAD_SPAWN_V51.md"
          Copy-Item "docs/RICO_HUD_AND_STUCK_V52.md" "$pkg/RICO_HUD_AND_STUCK_V52.md"
          Copy-Item "docs/HUD_X360_RACE_STAGING_V53.md" "$pkg/HUD_X360_RACE_STAGING_V53.md"
          Copy-Item "docs/FRR_ONLY_UPDATE_V54.md" "$pkg/FRR_ONLY_UPDATE_V54.md"
          Copy-Item "docs/STREET_DUEL_NO_CUTSCENE_V56_FOUNDATION.md" "$pkg/STREET_DUEL_NO_CUTSCENE_V56_FOUNDATION.md"
          Copy-Item "config/Rivals.ini" "$pkg/scripts/FreeRoamRivals/Rivals.ini"
          Copy-Item "config/VehiclePools.ini" "$pkg/scripts/FreeRoamRivals/VehiclePools.ini"
          Copy-Item "config/UndergroundBlacklist.ini" "$pkg/scripts/FreeRoamRivals/UndergroundBlacklist.ini"
          New-Item -ItemType Directory -Force "$pkg/tools" | Out-Null
          Copy-Item "tools/analyze_motion_capture.py" "$pkg/tools/"
          Copy-Item "tools/dump_exe_functions.py" "$pkg/tools/"
          Copy-Item "tools/collect_diagnostic_bundle.py" "$pkg/tools/"
          Copy-Item "tools/collect_diagnostics.cmd" "$pkg/tools/"
          Copy-Item "docs/DIAGNOSTIC_BUNDLE.md" "$pkg/DIAGNOSTIC_BUNDLE.md"
          Copy-Item "docs/DIAGNOSTIC_RESEARCH_2026-10-09.md" "$pkg/DIAGNOSTIC_RESEARCH_2026-10-09.md"
          Copy-Item "docs/TARGET_CAPTURE_V30_POST_RACE.md" "$pkg/TARGET_CAPTURE_V30_POST_RACE.md"
          Copy-Item "docs/MOTION_CAPTURE.md" "$pkg/MOTION_CAPTURE.md"
          Copy-Item "docs/RENDER_HOOK_RECOVERY.md" "$pkg/RENDER_HOOK_RECOVERY.md"
          Copy-Item "docs/GAMEPLAY_LOOP_RECOVERY.md" "$pkg/GAMEPLAY_LOOP_RECOVERY.md"
          Copy-Item "docs/TARGET_CAPTURE_2026-10-07.md" "$pkg/TARGET_CAPTURE_2026-10-07.md"
          Copy-Item "docs/TARGET_CAPTURE_V26_2026-10-07.md" "$pkg/TARGET_CAPTURE_V26_2026-10-07.md"
          Copy-Item "docs/TARGET_CAPTURE_V27_ALL_DIAGNOSTICS_2026-10-07.md" "$pkg/TARGET_CAPTURE_V27_ALL_DIAGNOSTICS_2026-10-07.md"
          Copy-Item "docs/TARGET_CAPTURE_V28_ALL_DIAGNOSTICS_2026-10-07.md" "$pkg/TARGET_CAPTURE_V28_ALL_DIAGNOSTICS_2026-10-07.md"
          Copy-Item "docs/COORDINATE_CONVENTIONS.md" "$pkg/COORDINATE_CONVENTIONS.md"
          Copy-Item "docs/TARGET_CAPTURE_V29_ALL_DIAGNOSTICS_2026-10-07.md" "$pkg/TARGET_CAPTURE_V29_ALL_DIAGNOSTICS_2026-10-07.md"
          Copy-Item "docs/EXE_DUMP_V2_FINDINGS.md" "$pkg/EXE_DUMP_V2_FINDINGS.md"
          Copy-Item "docs/TARGET_CAPTURE_V39_STARTUP_EXIT.md" "$pkg/TARGET_CAPTURE_V39_STARTUP_EXIT.md"
          Copy-Item "docs/TARGET_CAPTURE_V40_CONSTRUCTION_CONFIRMATION.md" "$pkg/TARGET_CAPTURE_V40_CONSTRUCTION_CONFIRMATION.md"
          Copy-Item "docs/TARGET_CAPTURE_V38_VISIBLE_GTI.md" "$pkg/TARGET_CAPTURE_V38_VISIBLE_GTI.md"
          Copy-Item "docs/NATIVE_RIVAL_PROTOTYPE.md" "$pkg/NATIVE_RIVAL_PROTOTYPE.md"
          Copy-Item "docs/POST_RACE_RACER_RESEARCH.md" "$pkg/POST_RACE_RACER_RESEARCH.md"
          Copy-Item "docs/NATIVE_ROAMING_STREAMING_RESEARCH.md" "$pkg/NATIVE_ROAMING_STREAMING_RESEARCH.md"

          @"
          NFSMW Free Roam Rivals v0.0.56-dev

          INSTALL:
          1. BACK UP scripts\FreeRoamRivals\FreeRoamRivals.ini if it contains
             custom settings. This ZIP replaces the active mod INI and ASI.
          2. Extract this ZIP into the game's ROOT folder (with speed.exe),
             replacing files when prompted. No renaming or manual INI edits.
             The included FreeRoamRivals.ini is already the PLAY preset;
             an alternative conservative file is FreeRoamRivals-safe.ini.
          3. Use a Golf GTI in Free Roam. With an existing verified cache,
             the metre scale is ready immediately: no driving to calibrate.
             On the FIRST v46 launch without cache, drive once until verified.
             The cache is then created automatically for later sessions.
          4. F8 creates one nearby GTI; F8 never removes an existing rival.
          5. Follow behind, within 60m, in the same direction. Press G when offered.
             Outrun scoring: hold 300m lead for 3 seconds; timeout 5 minutes.
          6. In this PLAY preset, hold Ctrl+Shift+R for 1.5s to REQUEST
             safe removal (not immediate); F7 is never polled.
             Cleanup requires no pursuit, verified owned identity, hidden and
             at least 300m away. No engine object is deleted blindly.
          7. ONLY after native retirement is confirmed absent from BOTH registries
             in two completed frames, F8 can request another guarded spawn.
             Any native fault blocks same-session retry: restart to retest.
          8. The HUD shows Rico distance/direction, actual approach/separation,
             challenge readiness (green G) and overtakes; no map waypoint.
             Driving AI and vehicle controller remain native and unchanged.
          9. F9 requests a bounded read-only audit. Send FreeRoamRivals.log and
             NativeExceptions.log after your gameplay test.
          F9 now audits on-disk CARS/GLOBAL/TRACKS and the registered
          attributes in safe Free Roam. Disk files do NOT prove native
          model residency and DO NOT bypass the Golf GTI prerequisite.
          In PLAY near-player mode, F8 now requires a clear road strictly
          AHEAD of the car's verified physical heading. No behind fallback.
          New FRR overlay: green RICO compass NEAR minimap (not a real
          Hud_Minimap icon), amber verified leader trail in Outrun, and
          passive warning after 12 seconds almost stationary.
          New independent FRR HUD: radar right by default, configurable
          RadarPosition=0/1/2/3 and RadarScale=0.5..1.5 for widescreen.
          Measured side-by-side readiness is read-only; no automatic braking,
          player input lock or countdown yet.
          No WidescreenFix, X360Stuff or game executable is included here.
          Choose the ASI-only ZIP if your original HUD is already fixed.
          Native nearby sudden loss (<250m) now logs a numeric presence
          audit of IVehicle and PVehicle registries, never unsafe respawn.
          Outrun remains chase-only; no side-by-side start or countdown.
          See STREET_DUEL_NO_CUTSCENE_V56_FOUNDATION.md for the actual 151m log.
          See FRR_ONLY_UPDATE_V54.md for three installation variants.
          See HUD_X360_RACE_STAGING_V53.md for compatibility and limits.
          See RICO_HUD_AND_STUCK_V52.md for earlier features.
          See RICO_AHEAD_SPAWN_V51.md for controls and expectations.
          See VISIBLE_PROTOTYPE_V50.md for first-test successful GTI and
          the second test constructor-null, near-camera F8 ranking, and limits.
          See ROAD_RESET_EVIDENCE_V49.md for logged ResetToRoad mismatch and
          accurate F8 availability after an irreversible native failure.
          See GUARDED_REENCOUNTER_V48.md for the October 11 bug, streaming
          limits, preventive hidden retirement and F8 queued reenounter.
          See NATIVE_ASSET_INVENTORY_V47.md for research and interpretation.
          See PERSISTENT_WORLD_METRIC_V46.md for automatic physical-unit caching.
          See RIVAL_REACTIONS_V45.md for interaction limits and controls.
          See RIVAL_LOCATOR_AND_RETRY_V44.md for native lifecycle safety.
          LIVE_RIVAL_V42.md describes the initial live encounter integration.

          Native driving was observed in the owner's v41 capture. New locator,
          road-reset diagnostics, repeat-retirement and HUD still need PC validation.
          Native roaming AI does not follow a player-selected race route.
          No cash, garage or vanilla save writes; no full tuned rival system yet.
          This is a development release, not a final/stable version.

          Supported development target:
          speed.exe size: 6029312 bytes
          MD5: C0516B485065FABDD69579816B5DF763
          "@ | Set-Content "$pkg/INSTALL.txt" -Encoding UTF8

          New-Item -ItemType Directory -Force "release" | Out-Null
          Compress-Archive -Path "$pkg/*" -DestinationPath "release/FreeRoamRivals-v0.0.56-dev.zip" -Force

          # Minimal update for existing v45 installations: preserve Rivals.ini,
          # VehiclePools.ini, UndergroundBlacklist.ini and all saved history.
          $upgrade = "release/upgrade"
          New-Item -ItemType Directory -Force "$upgrade/scripts/FreeRoamRivals" | Out-Null
          Copy-Item "artifact/FreeRoamRivals.asi" "$upgrade/scripts/FreeRoamRivals.asi"
          Copy-Item "config/FreeRoamRivals-play.ini" "$upgrade/scripts/FreeRoamRivals/FreeRoamRivals.ini"
          Copy-Item "docs/RIVAL_LOCATOR_AND_RETRY_V44.md" "$upgrade/RIVAL_LOCATOR_AND_RETRY_V44.md"
          Copy-Item "docs/RIVAL_REACTIONS_V45.md" "$upgrade/RIVAL_REACTIONS_V45.md"
          Copy-Item "docs/PERSISTENT_WORLD_METRIC_V46.md" "$upgrade/PERSISTENT_WORLD_METRIC_V46.md"
          Copy-Item "docs/NATIVE_ASSET_INVENTORY_V47.md" "$upgrade/NATIVE_ASSET_INVENTORY_V47.md"
          Copy-Item "docs/GUARDED_REENCOUNTER_V48.md" "$upgrade/GUARDED_REENCOUNTER_V48.md"
          Copy-Item "docs/ROAD_RESET_EVIDENCE_V49.md" "$upgrade/ROAD_RESET_EVIDENCE_V49.md"
          Copy-Item "docs/VISIBLE_PROTOTYPE_V50.md" "$upgrade/VISIBLE_PROTOTYPE_V50.md"
          Copy-Item "docs/RICO_AHEAD_SPAWN_V51.md" "$upgrade/RICO_AHEAD_SPAWN_V51.md"
          Copy-Item "docs/RICO_HUD_AND_STUCK_V52.md" "$upgrade/RICO_HUD_AND_STUCK_V52.md"
          Copy-Item "docs/HUD_X360_RACE_STAGING_V53.md" "$upgrade/HUD_X360_RACE_STAGING_V53.md"
          Copy-Item "docs/FRR_ONLY_UPDATE_V54.md" "$upgrade/FRR_ONLY_UPDATE_V54.md"
          Copy-Item "docs/STREET_DUEL_NO_CUTSCENE_V56_FOUNDATION.md" "$upgrade/STREET_DUEL_NO_CUTSCENE_V56_FOUNDATION.md"
          @"
          FREE ROAM RIVALS v0.0.56-dev - EXISTING INSTALLATION UPGRADE

          BACK UP your customized scripts\FreeRoamRivals\FreeRoamRivals.ini.
          Extract this ZIP to the existing NFSMW folder containing speed.exe,
          replacing the two mod files. NO INI EDITS or renames are needed.
          This UPGRADE only replaces:
          - scripts\FreeRoamRivals.asi
          - scripts\FreeRoamRivals\FreeRoamRivals.ini

          Existing Rivals.ini, VehiclePools.ini, UndergroundBlacklist.ini and
          scripts\FreeRoamRivals\saves are NOT included and remain untouched.
          The main INI has F8 spawning, G challenge, and Ctrl+Shift+R 1.5s
          guarded retirement, already configured. A previously verified
          metric is loaded automatically. First use without cache still needs
          motion calibration; no cache files or saves are distributed.
          New HUD feedback reacts
          to measured traffic, overtakes and challenge conditions; native AI
          steering and acceleration remain unchanged. In-game test pending.
          The game must be closed while replacing these files.
          "@ | Set-Content "$upgrade/INSTALAR-ATUALIZACAO.txt" -Encoding UTF8
          Compress-Archive -Path "$upgrade/*" -DestinationPath "release/FreeRoamRivals-v0.0.56-dev-upgrade.zip" -Force

          # This separate update contains ONLY our binary and one text guide.
          # It cannot overwrite the user's custom INI or WidescreenFix FixHUD.
          $asiOnly = "release/asi-only"
          New-Item -ItemType Directory -Force "$asiOnly/scripts" | Out-Null
          Copy-Item "artifact/FreeRoamRivals.asi" "$asiOnly/scripts/FreeRoamRivals.asi"
          @"
          Free Roam Rivals v0.0.56-dev - ASI ONLY
          Close the game and back up scripts\FreeRoamRivals.asi.
          Extract to the game root beside speed.exe.
          Replace ONLY scripts\FreeRoamRivals.asi.
          Nothing else is changed. WidescreenFix FixHUD=1 is preserved.
          Your existing FRR INI, save history and metric are untouched.
          "@ | Set-Content "$asiOnly/INSTALAR-ASI-SOMENTE.txt" -Encoding UTF8
          Compress-Archive -Path "$asiOnly/*" -DestinationPath "release/FreeRoamRivals-v0.0.56-dev-asi-only.zip" -Force

      - name: Verify ready-to-install package
        shell: pwsh
        run: |
          $path = "release/FreeRoamRivals-v0.0.56-dev.zip"
          if (!(Test-Path $path)) { throw "Install ZIP is missing" }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $path).Path)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace("\\","/") })
            $required = @(
              "scripts/FreeRoamRivals.asi",
              "scripts/FreeRoamRivals/FreeRoamRivals.ini",
              "scripts/FreeRoamRivals/Rivals.ini",
              "scripts/FreeRoamRivals/VehiclePools.ini",
              "scripts/FreeRoamRivals/UndergroundBlacklist.ini",
              "INSTALL.txt",
              "FreeRoamRivals-safe.ini",
              "RIVAL_LOCATOR_AND_RETRY_V44.md",
              "RIVAL_REACTIONS_V45.md",
              "PERSISTENT_WORLD_METRIC_V46.md",
              "NATIVE_ASSET_INVENTORY_V47.md",
              "GUARDED_REENCOUNTER_V48.md",
              "ROAD_RESET_EVIDENCE_V49.md",
              "VISIBLE_PROTOTYPE_V50.md",
              "RICO_AHEAD_SPAWN_V51.md",
              "RICO_HUD_AND_STUCK_V52.md",
              "HUD_X360_RACE_STAGING_V53.md",
              "FRR_ONLY_UPDATE_V54.md",
              "STREET_DUEL_NO_CUTSCENE_V56_FOUNDATION.md"
            )
            foreach ($item in $required) {
              if ($names -cnotcontains $item) { throw "Missing package entry: $item" }
            }
          } finally { $zip.Dispose() }
          $ini = Get-Content "release/package/scripts/FreeRoamRivals/FreeRoamRivals.ini" -Raw
          foreach ($setting in @(
            "NativeRivalPrototypeEnabled=1",
            "NativeRivalPrototypeNearPlayer=1",
            "RetireRivalKey=0x52",
            "FallbackChallengeKey=0x47",
            "Enabled=1"
          )) {
            if (!$ini.Contains($setting)) { throw "Play INI missing $setting" }
          }
          if ($ini.Contains("RetireRivalKey=0" + [char]10)) { throw "Manual retirement was silently disabled" }
          $upgradePath = "release/FreeRoamRivals-v0.0.56-dev-upgrade.zip"
          if (!(Test-Path $upgradePath)) { throw "Upgrade ZIP is missing" }
          $upgradeZip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $upgradePath).Path)
          try {
            $upgradeNames = @($upgradeZip.Entries | ForEach-Object { $_.FullName.Replace("\\","/") })
            foreach ($item in @("scripts/FreeRoamRivals.asi","scripts/FreeRoamRivals/FreeRoamRivals.ini","INSTALAR-ATUALIZACAO.txt","RIVAL_REACTIONS_V45.md","PERSISTENT_WORLD_METRIC_V46.md","NATIVE_ASSET_INVENTORY_V47.md","GUARDED_REENCOUNTER_V48.md","ROAD_RESET_EVIDENCE_V49.md","VISIBLE_PROTOTYPE_V50.md","RICO_AHEAD_SPAWN_V51.md","RICO_HUD_AND_STUCK_V52.md","HUD_X360_RACE_STAGING_V53.md","FRR_ONLY_UPDATE_V54.md","STREET_DUEL_NO_CUTSCENE_V56_FOUNDATION.md")) {
              if ($upgradeNames -cnotcontains $item) { throw "Upgrade missing: $item" }
            }
            foreach ($item in $upgradeNames) {
              if ($item -match '(?i)(?:/saves/|/world-metric-v1\.state$|/Rivals\.ini$|/VehiclePools\.ini$|/UndergroundBlacklist\.ini$)') {
                throw "Upgrade must not overwrite customized data: $item"
              }
            }
          } finally { $upgradeZip.Dispose() }
          foreach ($item in $names) {
            if ($item -match '(?i)(/saves/|/world-metric-v1\.state$)') { throw "Main ZIP unexpectedly contains user state" }
          }
          # Explicitly block bundled third-party fixes, the base executable
          # and non-FRR textures/shaders in all archive variants.
          $deny = '(?i)(^|/)(speed\.exe|dinput8\.dll|[^/]*widescreenfix[^/]*|[^/]*x360stuff[^/]*|[^/]*xtendedinput[^/]*|[^/]*\.tpk|[^/]*\.dds|[^/]*\.hlsl)$'
          foreach ($candidate in @("release/FreeRoamRivals-v0.0.56-dev.zip","release/FreeRoamRivals-v0.0.56-dev-upgrade.zip","release/FreeRoamRivals-v0.0.56-dev-asi-only.zip")) {
            $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $candidate).Path)
            try {
              foreach ($entry in $z.Entries) {
                $n = $entry.FullName.Replace([char]92,"/")
                if ($n -match $deny) { throw "Third-party or game file not permitted: $n" }
              }
            } finally { $z.Dispose() }
          }
          $only = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "release/FreeRoamRivals-v0.0.56-dev-asi-only.zip").Path)
          try {
            $items = @($only.Entries | ForEach-Object { $_.FullName.Replace([char]92,"/") } | Where-Object { -not $_.EndsWith("/") })
            $expected = @("scripts/FreeRoamRivals.asi","INSTALAR-ASI-SOMENTE.txt")
            if ($items.Count -ne 2) { throw "ASI-only package must contain exactly two files" }
            foreach ($item in $items) { if ($expected -cnotcontains $item) { throw "ASI-only unexpected file: $item" } }
            foreach ($item in $expected) { if ($items -cnotcontains $item) { throw "ASI-only missing file: $item" } }
          } finally { $only.Dispose() }
          Write-Output "All three ZIPs verified: none changes WidescreenFix; ASI-only preserves user INIs."

      - name: Upload ready-to-install ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeRoamRivals-ReadyToInstall-v56
          path: |
            release/FreeRoamRivals-v0.0.56-dev.zip
            release/FreeRoamRivals-v0.0.56-dev-upgrade.zip
            release/FreeRoamRivals-v0.0.56-dev-asi-only.zip
          if-no-files-found: error

      - name: Publish v0.0.56-dev GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.0.56-dev"

          $files = @(
            "release/FreeRoamRivals-v0.0.56-dev.zip",
            "release/FreeRoamRivals-v0.0.56-dev-upgrade.zip",
            "release/FreeRoamRivals-v0.0.56-dev-asi-only.zip"
          )
          $published = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $existing = gh release view $tag --json targetCommitish,assets 2>$null
            if ($LASTEXITCODE -eq 0) {
              $info = $existing | ConvertFrom-Json
              if ($info.targetCommitish -ne "${{ github.sha }}") {
                throw "Existing release target does not match this source commit."
              }
              foreach ($file in $files) {
                $name = Split-Path $file -Leaf
                if ($info.assets.name -notcontains $name) {
                  gh release upload $tag $file
                  if ($LASTEXITCODE -ne 0) { throw "Failed to publish $name" }
                }
              }
              $published = $true
              break
            } else {
              gh release create $tag $files `
                --target "${{ github.sha }}" `
                --title "Free Roam Rivals v0.0.56-dev" `
                --prerelease `
                --notes "v0.0.56-dev: log real demonstrou Rico sumindo com apenas 151m de distancia em Free Roam, antes da transicao de mundo. A ASI agora guarda a ultima amostra de distancia/velocidade e faz auditoria SOMENTE NUMERICA das listas IVehicle/PVehicle ao detectar perda, sem ler objeto apagado; o HUD distingue RICO SUMIU PERTO DE VOCE e o Outrun e identificado como Outrun livre sem largada conjunta. NAO corrige streaming do motor nem implementa Sprint/cutscene/buzina. Atualizacao ASI-only continua disponivel para preservar o WidescreenFix FixHUD=1, INIs, metric e saves; auditoria de 3 ZIPs continua."
            }
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          if (-not $published) { throw "Release publication failed after three attempts." }
