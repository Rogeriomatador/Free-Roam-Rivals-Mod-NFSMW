name: NextGen independent-native-racers candidate

# This pipeline NEVER modifies the stable FreeRoamRivals v0.0.61 ASI or release.
# It builds a standalone artifact from the official, checksummed MIT release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/prepare_nextgen.py'
      - 'tests/test_prepare_nextgen.py'
      - 'nextgen/**'
      - '.github/workflows/nextgen-candidate.yml'

permissions:
  contents: read

jobs:
  deterministic-offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise 10 fail-closed packaging and INI cases
        run: python3 -m unittest discover -s tests -p test_prepare_nextgen.py -v

  official-upstream-standalone-artifact:
    needs: deterministic-offline-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch two public, upstream v0.1.2 release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upstream
          gh release download v0.1.2 --repo Zakkey250/MW-NativeFreeRoamRacer --pattern MW-NativeFreeRoamRacer-v0.1.2.zip --dir upstream
          gh release download v0.1.2 --repo Zakkey250/MW-NativeFreeRoamRacer --pattern SHA256SUMS.txt --dir upstream

      - name: Independently audit SHA256 and construct isolated runtime stage
        run: |
          python3 tools/prepare_nextgen.py \
            --upstream-zip upstream/MW-NativeFreeRoamRacer-v0.1.2.zip \
            --checksums upstream/SHA256SUMS.txt \
            --license nextgen/LICENSE-NFRR-MIT.txt \
            --output-dir candidate-stage

      - name: Verify exclusive vehicle-manager packaging, hash report and license
        run: |
          test ! -f candidate-stage/NEXT-Standalone/scripts/FreeRoamRivals.asi
          test -f candidate-stage/NEXT-Standalone/scripts/NFSMWNativeFreeRoamRacers.asi
          test -f candidate-stage/NEXT-Standalone/scripts/NFSMWNativeFreeRoamRacers.ini
          test -f candidate-stage/NEXT-Standalone/scripts/NFSMWNativeFreeRoamRacers.tpk
          test -f candidate-stage/NEXT-Standalone/LICENCA-NFRR-MIT.txt
          test -f candidate-stage/NEXT-Standalone/HASHES-SHA256.txt
          (cd candidate-stage/NEXT-Standalone && sha256sum -c HASHES-SHA256.txt)

      - name: Create a RESEARCH candidate ZIP — not a new official release
        run: |
          cd candidate-stage
          zip -q -r ../FreeRoamRivals-NEXT-Standalone-EXPERIMENTAL.zip NEXT-Standalone
          cd ..
          unzip -Z1 FreeRoamRivals-NEXT-Standalone-EXPERIMENTAL.zip > candidate-contents.txt
          if grep -i 'scripts/FreeRoamRivals.asi' candidate-contents.txt; then
            echo "ERROR: cannot ship both rival manager ASIs"
            exit 1
          fi

      - name: Upload optional, safely isolated candidate
        uses: actions/upload-artifact@v4
        with:
          name: NEXT-Standalone-EXPERIMENTAL-v012
          path: FreeRoamRivals-NEXT-Standalone-EXPERIMENTAL.zip
          if-no-files-found: error


  source-fork-win32-build:
    needs: deterministic-offline-validation
    runs-on: windows-latest
    steps:
      - name: Checkout our repo (without changing our FRR main release)
        uses: actions/checkout@v4
      - name: Fetch precisely pinned MIT upstream source commit
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "frr-next-native-source"
          git clone --quiet https://github.com/Zakkey250/MW-NativeFreeRoamRacer.git $source
          if ($LASTEXITCODE -ne 0) { throw "Failed upstream clone" }
          git -C $source checkout --quiet 8865f3f2fb7a4b56c8ed7e40e8ed091807564d5a
          if ($LASTEXITCODE -ne 0) { throw "Cannot checkout pinned tag commit" }
          $actual = (git -C $source rev-parse HEAD).Trim()
          if ($actual -ne "8865f3f2fb7a4b56c8ed7e40e8ed091807564d5a") {
            throw "Upstream commit changed unexpectedly"
          }
          Write-Output "Pinned upstream source: $actual"
      - name: Rebuild upstream native-racer runtime from MIT C++ sources
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "frr-next-native-source"
          & (Join-Path $source "NFSMWNativeFreeRoamRacers/tools/Build.ps1")
          if ($LASTEXITCODE -ne 0) { throw "Upstream Win32 Release compile failed" }
          $asi = Join-Path $source "NFSMWNativeFreeRoamRacers/artifacts/Release/NFSMWNativeFreeRoamRacers.asi"
          if (!(Test-Path $asi)) { throw "Missing real source-built native-racer .asi" }
          $size = (Get-Item $asi).Length
          if ($size -lt 50000 -or $size -gt 16777216) {
            throw "Compiled ASI size outside expected safety envelope"
          }
          New-Item -ItemType Directory -Force nextgen-sourcebuilt | Out-Null
          Copy-Item $asi nextgen-sourcebuilt/
          Get-FileHash $asi -Algorithm SHA256 | Format-List
          Write-Output "SOURCE BUILD ONLY: never run concurrently with FreeRoamRivals.asi"
      - name: Exercise official upstream offline unit/ownership tests
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "frr-next-native-source"
          & (Join-Path $source "NFSMWNativeFreeRoamRacers/tools/Test-CacheOwnership.ps1")
          if ($LASTEXITCODE -ne 0) { throw "Upstream cache/lifetime offline suite failed" }
      - name: Upload independently built, modification-ready NFRR Win32 engine
        uses: actions/upload-artifact@v4
        with:
          name: NEXT-Upstream-MIT-SourceBuild-Win32-v012
          path: nextgen-sourcebuilt/NFSMWNativeFreeRoamRacers.asi
          if-no-files-found: error
