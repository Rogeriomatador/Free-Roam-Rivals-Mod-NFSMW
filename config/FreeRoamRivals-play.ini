; v0.0.44-dev PLAY PRESET: F8 creates; G challenges; Ctrl+Shift+R requests safe retirement.
; NFSMW Free Roam Rivals
; v0.0.40-dev: complete diagnostics + manual F8 nearby Golf GTI test.
; Start the game without F8 first. Creation requires a separate F8 request.
; Do not include or alter NFSMostWanted.WidescreenFix.asi/.ini, X360Stuff,
; dinput8.dll or speed.exe in any Free Roam Rivals installer.
; The owner independently fixed the native minimap layout by using FixHUD=1
; in the already installed WidescreenFix; FRR must leave that config untouched.
; ASI-only upgrades leave this mod's own INI and saves untouched too.

[General]
Enabled=1
DebugLog=1
DeveloperMode=0

[Compatibility]
RequireSupportedExecutable=1

[Diagnostics]
; Native first-chance exception trace. Does not suppress exceptions or modify context.
; Default on even when absent from an older INI; produces NativeExceptions.log.
ExceptionDiagnosticsEnabled=1
; Enable F9 code/module/world audit with no per-sample motion dump.
; Does not itself construct native vehicles (F8 remains manual).
DiagnosticBundleEnabled=1
RenderProbeEnabled=1
InputProbeEnabled=1
RoadNavDiagnosticsEnabled=1
; Opt-in verified main-loop entry/completion ownership diagnostics.
FrameTickProbeEnabled=1
; Calls the verified MW05 world-collision query only from the confirmed
; verified completed gameplay loop. Requires FrameTickProbeEnabled=1.
WorldCollisionDiagnosticsEnabled=1
; Guarded primary-camera/view matrix reads; diagnostic only.
CameraFrustumDiagnosticsEnabled=1
; Lightweight play preset: disable high-volume per-sample telemetry.
; Native errors, stage transitions, F9 audit and periodic observations remain logged.
MotionCaptureEnabled=0
; Optional extra post-race probes remain off during ordinary play tests.
PostRaceRacerDiagnosticsEnabled=0
RuntimeSampleEveryFrames=30
RuntimeProbeHeartbeatFrames=600

[LiveRival]
HUDEnabled=1
; FRR independent overlay (works without Xbox360 Stuff). Responsive to D3D viewport.
; RadarPosition: 0 = lower left (legacy), 1 = upper right, 2 = middle right, 3 = off
; RadarScale: 0.50 to 1.50. Does not change native minimap or WidescreenFix settings.
RadarPosition=2
RadarScale=1.00
PersistHistory=1
ChallengeDistanceMeters=60

[Population]
EnableAuthoredRivals=1
EnableProceduralLocals=1
PromoteLocalToPersistentOnAcceptedChallenge=1
PersistGeneratedVehicle=1
PersistGeneratedCustomization=1
SoftAvoidImmediateModelRepeat=1
ProceduralIdentityDeterministic=1
ProceduralNamesEnabled=1
MaxLiveRivalsEarly=1
MaxLiveRivalsMidLate=2
MaxLiveRivalsRockportLegend=3

[Rivals]
MaxActiveRivals=1
SpawnMinDistanceMeters=350
SpawnMaxDistanceMeters=850
NoSpawnVisibleRadiusMeters=300
DespawnDistanceMeters=1400
InterestRadiusMeters=90
ChallengeRadiusMeters=20
ChallengeTimeoutSeconds=12

[Experimental]
; Experimental in-game test: drive a Golf GTI, calibrate motion, press F8.
; The play preset explicitly enables a guarded retirement key; default INI still disables it.
NativeRivalPrototypeEnabled=1
; Explicit visible test on a free road target 20-120m away. Requires Enabled=1.
NativeRivalPrototypeNearPlayer=1
ExperimentalSpawnEnabled=0
ExperimentalAIControlEnabled=0
ExperimentalEconomyWritesEnabled=0
ExperimentalGarageWritesEnabled=0
StableFreeRoamSamplesBeforeSpawn=6

[Input]
; Opt-in play preset: 0x52=R; hold Ctrl+Shift+R for 1.5s.
; Hidden + 300m + clear pursuit + verified owned-identity removal required.
RetireRivalKey=0x52
RetireRequireControlShift=1
RetireHoldSeconds=1.5
; Design target: horn-to-challenge. The verified MW05 action table currently
; exposes no native HORN/HONK action, so this flag is informational until a
; real horn source is identified.
UseHornToChallenge=1
; Windows virtual-key value. 0x47 = G. Set 0 to disable fallback input.
FallbackChallengeKey=0x47

[Progression]
StreetRepEnabled=1
RockportLegendAfterCareerComplete=1
HighStakesMinRep=150
LegendaryMinRep=500
LegendaryMinWins=30
LegendaryMinPinkSlipWins=3

[UndergroundBlacklist]
Enabled=1
UnlockAfterVanillaCareerCompletion=1
RequirePhysicalEncounter=1
HideIdentityUntilSighted=1
AllowMenuFastStart=0
PersistProgress=1

[WorldDirector]
Enabled=0
OrdinaryRivalWeight=100
RevengeRivalWeight=20
StreetMeetWeight=8
RivalVsRivalWeight=5
LegendaryWeight=1
MinimumEventCooldownSeconds=120

[Outrun]
Enabled=1
WinLeadMeters=300
LeadHoldSeconds=3.0
MaxDurationSeconds=300

[Staging]
Enabled=0
; Advanced in-game experiment: BOTH cars already side by side under ~29km/h,
; G requests native ForceStop/3-2-1/release. If BOTH native releases
; succeed, a real 120m straight-line physical finish starts and stores
; wins/losses. Ctrl+Shift+G toggles Sprint/Outrun for this session without
; changing any INI. No auto-alignment, no input takeover or stock race event.
; Do NOT enable on primary saves before testing on a game copy.
NativeDuelPilotEnabled=0
; Physical shared-finish short straight duel, only if pilot enabled.
SprintLengthMeters=120
SearchAheadMeters=160
ApproachTimeoutSeconds=10
AlignmentTimeoutSeconds=5
AllowHiddenAlignmentFallback=1
PreferredStyle=SideBySide

[Economy]
Enabled=0
CashWagers=0
ReputationWagers=0
AllowCounterOffers=0

[PinkSlip]
