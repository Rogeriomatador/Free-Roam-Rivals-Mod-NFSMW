; NFSMW Free Roam Rivals
; v0.0.5-dev: read-only runtime validation.

[General]
Enabled=1
DebugLog=1
DeveloperMode=0

[Compatibility]
RequireSupportedExecutable=1

[Diagnostics]
; EndScene is the primary observation heartbeat in v0.0.5.
; It only reads state. No game state is mutated from the render callback.
RenderProbeEnabled=1

; Keep the SDK input hook as a second independent signal.
; v0.0.4 reported successful installation on the target machine, but the
; provided log contained no callback samples, so v0.0.5 measures it explicitly.
InputProbeEnabled=1

; Sample the world every N presented frames instead of every frame.
RuntimeSampleEveryFrames=30
RuntimeProbeHeartbeatFrames=600

[Rivals]
MaxActiveRivals=1
SpawnMinDistanceMeters=350
SpawnMaxDistanceMeters=850
NoSpawnVisibleRadiusMeters=300
DespawnDistanceMeters=1400
InterestRadiusMeters=90
ChallengeRadiusMeters=20
ChallengeTimeoutSeconds=12

[Experimental]
; Hard safety gate. v0.0.5 does not execute spawning even if changed.
; This exists now so later experimental builds cannot accidentally default ON.
ExperimentalSpawnEnabled=0
ExperimentalAIControlEnabled=0
ExperimentalEconomyWritesEnabled=0
ExperimentalGarageWritesEnabled=0

[Input]
UseHornToChallenge=1
FallbackChallengeKey=0x47

[Progression]
StreetRepEnabled=1
RockportLegendAfterCareerComplete=1
HighStakesMinRep=150
LegendaryMinRep=500
LegendaryMinWins=30
LegendaryMinPinkSlipWins=3

[WorldDirector]
Enabled=0
OrdinaryRivalWeight=100
RevengeRivalWeight=20
StreetMeetWeight=8
RivalVsRivalWeight=5
LegendaryWeight=1
MinimumEventCooldownSeconds=120

[Outrun]
Enabled=0
WinLeadMeters=300
LeadHoldSeconds=3.0
MaxDurationSeconds=300

[Staging]
Enabled=0
SearchAheadMeters=160
ApproachTimeoutSeconds=10
AlignmentTimeoutSeconds=5
AllowHiddenAlignmentFallback=1
PreferredStyle=SideBySide

[Economy]
Enabled=0
CashWagers=0
ReputationWagers=0
AllowCounterOffers=0

[PinkSlip]
Enabled=0
MinimumOwnedCars=2
AllowPlayerLoseCar=0
AllowPlayerWinCar=0
RequireSafeGarageSlot=1
RequireTransactionJournal=1
HoldToConfirm=1

[Police]
RaceContinuesDuringPursuit=1
