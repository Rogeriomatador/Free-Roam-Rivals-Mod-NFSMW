; NFSMW Free Roam Rivals
; v0.0.9-dev: read-only runtime bridge + road navigation diagnostics
; + rival population + race/staging foundations.

[General]
Enabled=1
DebugLog=1
DeveloperMode=0

[Compatibility]
RequireSupportedExecutable=1

[Diagnostics]
RenderProbeEnabled=1
InputProbeEnabled=1
RoadNavProbeEnabled=1
RuntimeSampleEveryFrames=30
RuntimeProbeHeartbeatFrames=600

; A road-nav line is written every N runtime samples while safely roaming.
; With the defaults at ~60 FPS this is roughly every 10 seconds.
RoadNavLogEverySamples=20

[Population]
; Vanilla traffic is never converted wholesale into racers.
; Core rivals are persistent; procedural locals are weighted by progression.
EnableAuthoredRivals=1
EnableProceduralLocals=1
PromoteLocalToPersistentOnAcceptedChallenge=1
PersistGeneratedVehicle=1
PersistGeneratedCustomization=1
SoftAvoidImmediateModelRepeat=1
ProceduralIdentityDeterministic=1
ProceduralNamesEnabled=1
MaxLiveRivalsEarly=1
MaxLiveRivalsMidLate=2
MaxLiveRivalsRockportLegend=3

[Rivals]
MaxActiveRivals=1
SpawnMinDistanceMeters=350
SpawnMaxDistanceMeters=850
NoSpawnVisibleRadiusMeters=300
DespawnDistanceMeters=1400
InterestRadiusMeters=90
ChallengeRadiusMeters=20
ChallengeTimeoutSeconds=12

[Experimental]
; Hard safety gates. Runtime mutation remains OFF by default.
ExperimentalSpawnEnabled=0
ExperimentalAIControlEnabled=0
ExperimentalEconomyWritesEnabled=0
ExperimentalGarageWritesEnabled=0

; Enabling ExperimentalSpawnEnabled still does NOT construct a vehicle.
; It only enables the fail-closed environment preflight.
StableFreeRoamSamplesBeforeSpawn=6

[Input]
UseHornToChallenge=1
FallbackChallengeKey=0x47

[Progression]
StreetRepEnabled=1
RockportLegendAfterCareerComplete=1
HighStakesMinRep=150
LegendaryMinRep=500
LegendaryMinWins=30
LegendaryMinPinkSlipWins=3

[WorldDirector]
Enabled=0
OrdinaryRivalWeight=100
RevengeRivalWeight=20
StreetMeetWeight=8
RivalVsRivalWeight=5
LegendaryWeight=1
MinimumEventCooldownSeconds=120

[Outrun]
; Core race logic exists, but the live road-progress adapter/HUD are not
; wired yet, so this remains off.
Enabled=0
WinLeadMeters=300
LeadHoldSeconds=3.0
MaxDurationSeconds=300

[Staging]
; Planner/state logic exists. v0.0.9 measures the player's live road-nav
; geometry so the next build can feed real candidates into the planner.
Enabled=0
SearchAheadMeters=160
ApproachTimeoutSeconds=10
AlignmentTimeoutSeconds=5
AllowHiddenAlignmentFallback=1
PreferredStyle=SideBySide

[Economy]
Enabled=0
CashWagers=0
ReputationWagers=0
AllowCounterOffers=0

[PinkSlip]
Enabled=0
MinimumOwnedCars=2
AllowPlayerLoseCar=0
AllowPlayerWinCar=0
RequireSafeGarageSlot=1
RequireTransactionJournal=1
HoldToConfirm=1

[Police]
RaceContinuesDuringPursuit=1
